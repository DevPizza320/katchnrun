<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katch N' Run</title>
    <link rel="icon" type="image/x-icon" href="icon.png">

    <!-- ! Lib CSS files -->
    <link rel="stylesheet" href="./assets/styles/queries.css">
    <link rel="stylesheet" href="./assets/styles/keyframes.css">
    <link rel="stylesheet" href="./assets/styles/main.css">
    <link rel="stylesheet" href="./assets/styles/themes.css">

    <!-- ! Non Lib CSS files -->
    <link rel="stylesheet" href="./assets/styles/gui/launch.css">
    <link rel="stylesheet" href="./assets/styles/gui/world.css">
    <link rel="stylesheet" href="./assets/styles/gui/menu.css">
    <link rel="stylesheet" href="./assets/styles/gui/settings.css">

    <!-- ! Asset Loader -->
    <script type="module" src="./assets/scripts/assets.js" defer></script>
</head>

<body>
    <!-- Game Containers -->
    <canvas id="launch" class="fullscreen"></canvas>
    <canvas id="world" class="fullscreen game-canvas"></canvas>

    <div id="sky" class="fullscreen game-canvas"></div>
    <div id="darkness" class="fullscreen game-canvas"></div>
    <div class="screen_effects"></div>
    <div class="shaders"></div>

    <div id="controls-container">
        <button class="themed-button-wooden themed-text-wooden control-button" id="controls-keyboard">
            <span>Play with Keyboard</span>
        </button>
        <button class="themed-button-wooden themed-text-wooden control-button no-access" id="controls-touch">
            <span>Play with Touch</span>
        </button>
    </div>
    <span id="game-title" style="display: none;">Katch N' Run</span>

    <!-- App Containers -->
    <div class="app fullscreen hidden">
        <div class="menu-options">
            <button class="themed-button-wooden themed-text-wooden" gamemode="singleplayer" id="lone-runner">
                <span>Lone Runner</span>
            </button>
            <button class="themed-button-wooden themed-text-wooden no-access no-hover" gamemode="multiplayer" id="rival-run">
                <span>Rival Run</span>
            </button>
        </div>
        <button class="themed-button-wooden themed-text-wooden" id="settings">
            <img src="./assets/textures/gui/settings.png" alt="⚙️">
        </button>
    </div>

    <div class="settings fullscreen themed-window-blurry hidden">
        <!-- ! KEYBOARD CONTROLS -->
        <fieldset id="keyboard" class="themed-text-wooden themed-window-wooden">
            <legend>Keyboard</legend>
            <button class="themed-button-wooden setting no-hover" id="left">
                <span>Left:</span>
            </button>
            <button class="themed-button-wooden value" id="left-value">
                <span>A</span>
            </button>
            <button class="themed-button-wooden setting no-hover" id="right">
                <span>Right:</span>
            </button>
            <button class="themed-button-wooden value" id="right-value">
                <span>D</span>
            </button>
            <button class="themed-button-wooden setting no-hover" id="jump">
                <span>Jump:</span>
            </button>
            <button class="themed-button-wooden value" id="jump-value">
                <span>Space</span>
            </button>
        </fieldset>

        <!-- ! TOUCH CONTROLS -->
        <fieldset id="touch" class="themed-text-wooden themed-window-wooden">
            <legend>Touch</legend>
            <button class="themed-button-wooden setting no-hover no-access" id="control-mode">
                <span>Controls:</span>
            </button>
            <button class="themed-button-wooden value no-access" id="control-mode-value">
                <span>Buttons</span>
            </button>
            <button class="themed-button-wooden setting no-hover no-access" id="sensitivity">
                <span>Sensitivity:</span>
            </button>
            <div class="input-group no-access" id="sensitivity-group">
                <input class="themed-button-wooden" type="range" name="sensitivity" id="sensitivity-value" min="0" max="200" value="100" step="1"
                onclick="document.getElementById('sensitivity-label').textContent = this.value + '%'">
                <span id="sensitivity-label">100%</span>
            </div>
            <button class="themed-button-wooden setting no-hover no-access" id="inverted">
                <span>Inverted:</span>
            </button>
            <button class="themed-button-wooden value no-access" id="inverted-value">
                <span>False</span>
            </button>
        </fieldset>

        <!-- ! Music -->
        <fieldset id="music" class="themed-text-wooden themed-window-wooden">
            <legend>Music</legend>
            <button class="themed-button-wooden setting no-hover" id="master">
                <span>Master:</span>
            </button>
            <div class="input-group" id="master-group">
                <input class="themed-button-wooden" type="range" name="master" id="master-value" min="0" max="100" value="50" step="1"
                onclick="document.getElementById('master-label').textContent = this.value + '%'">
                <span id="master-label">50%</span>
            </div>
            <button class="themed-button-wooden setting no-hover" id="music">
                <span>Music:</span>
            </button>
            <div class="input-group" id="music-group">
                <input class="themed-button-wooden" type="range" name="music" id="music-value" min="0" max="100" value="50" step="1"
                onclick="document.getElementById('music-label').textContent = this.value + '%'">
                <span id="music-label">50%</span>
            </div>
            <button class="themed-button-wooden setting no-hover" id="sfx">
                <span>SFX:</span>
            </button>
            <div class="input-group" id="sfx-group">
                <input class="themed-button-wooden" type="range" name="sfx" id="sfx-value" min="0" max="100" value="50" step="1"
                onclick="document.getElementById('sfx-label').textContent = this.value + '%'">
                <span id="sfx-label">50%</span>
            </div>
        </fieldset>

        <!-- ! Socials -->
        <fieldset id="socials" class="themed-text-wooden themed-window-wooden">
            <legend>Socials</legend>
            <button class="themed-button-wooden themed-text-wooden no-access" id="youtube">
                <img src="./assets/textures/gui/youtube.png" alt="YT">
            </button>
            <button class="themed-button-wooden themed-text-wooden" id="discord" onclick="window.open(`https://discord.gg/zZQCksfshQ`, '_blank').focus()">
                <img src="./assets/textures/gui/discord.png" alt="Discord">
            </button>
            <span>Shape the future of the game by joining our Discord to vote on the next big features today!</span>
        </fieldset>

        <!-- ! Save and Exit -->
        <fieldset id="save-and-exit" class="themed-text-wooden themed-window-wooden">
            <legend>Save and Exit</legend>
            <button class="themed-button-wooden themed-text-wooden" id="save-and-exit-btn" style="background: var(--brown-1);">
                <span>Save and Exit</span>
            </button>
            <button class="themed-button-wooden themed-text-wooden" id="back-btn">
                <span>Back</span>
            </button>
        </fieldset>
    </div>

    <!-- Scripts -->
    <script type="module" src="./assets/scripts/entry.js"></script>
    <script type="module" src="./config/device.js"></script>
    <script type="module" src="./assets/scripts/run.js"></script>
    <script type="module" src="./assets/scripts/game/items/items.js"></script>
</body>

</html>
